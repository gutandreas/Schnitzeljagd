spring.application.name=schnitzeljagd

# H2 als Datei. Auf dem Server zeigt SCHNITZELJAGD_DB_PATH in ein Docker-Volume,
# damit die Daten einen Neustart des Containers ueberleben.
spring.datasource.url=jdbc:h2:file:${SCHNITZELJAGD_DB_PATH:./data/schnitzeljagd}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Die H2-Konsole ist bewusst aus: sie war frueher unter /h2-ui ohne Passwort offen.
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=8080

### Einstellungen der Schnitzeljagd ###

# Basis-URL, die in den QR-Codes steht. Muss von aussen erreichbar sein!
schnitzeljagd.base-url=${SCHNITZELJAGD_BASE_URL:http://localhost:8080}

# Titel auf der Startseite
schnitzeljagd.title=${SCHNITZELJAGD_TITLE:Schnitzeljagd}

# true = jede Person laeuft die Posten in eigener Reihenfolge ab (verhindert Stau)
schnitzeljagd.shuffle=true

# Passwort fuer den Adminbereich (Benutzername: admin)
schnitzeljagd.admin-password=${SCHNITZELJAGD_ADMIN_PASSWORD:admin}
