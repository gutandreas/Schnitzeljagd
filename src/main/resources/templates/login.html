<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Anmeldung Adminbereich</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/questionstyle.css}" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div class="page">
<div class="card">
    <h1>Adminbereich</h1>

    <p th:if="${param.error}" class="result-message result-error">Benutzername oder Passwort stimmt nicht.</p>
    <p th:if="${param.logout}" class="result-message result-success">Du bist abgemeldet.</p>

    <form th:action="@{/login}" method="post">
        <label for="username">Benutzername:</label>
        <input type="text" id="username" name="username" autocomplete="username" required>

        <label for="password">Passwort:</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit" id="sendButton" class="btn btn-primary">Anmelden</button>
    </form>
</div>
</div>
</body>
</html>
