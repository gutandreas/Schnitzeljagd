<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Abschluss der Schnitzeljagd</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" th:href="@{/css/questionstyle.css}" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<img src="/images/logo.png" alt="Logo">
<h1>Abschluss der Schnitzeljagd</h1>
<p th:if="${participant == null}">Hast du alle Posten gelöst? Gib deinen Code ein, dann wird die Zeit gestoppt.</p>
<p th:if="${participant != null}">
    Hast du alle Posten gelöst, <span th:text="${participant.groupName}">Gruppenname</span>?
    Dann wird jetzt die Zeit gestoppt.
</p>

<form th:action="@{/checkout}" method="post">
    <div th:style="${participant != null} ? 'display: none;' : ''">
        <label for="code">Code:</label>
        <input type="text" id="code" name="code" maxlength="8" th:value="${code}"
               th:required="${participant == null}">
    </div>
    <button type="submit" id="sendButton">Schnitzeljagd abschliessen</button>
</form>

<p th:if="${result != null}" th:text="${result.message}"
   th:style="${result.success} ? 'color: #2e7d32;' : 'color: #b03030;'">Rückmeldung</p>

<p style="font-size: 18px;">
    <a th:href="@{/ranking}">Zur Rangliste</a>
</p>
</body>
</html>
