<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teilnehmende</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/adminstyle.css}" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div th:replace="~{admin/layout :: topbar}"></div>

<div class="content">
    <div th:replace="~{admin/layout :: messages}"></div>

    <h1>Teilnehmende</h1>

    <table>
        <thead>
        <tr>
            <th>Vorname</th>
            <th>Name</th>
            <th>Code</th>
            <th>Jagd</th>
            <th>Start</th>
            <th>Fortschritt</th>
            <th>Tipps</th>
            <th>Zeit</th>
            <th style="width: 110px;">Aktion</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="participant : ${participants}">
            <td th:text="${participant.firstName}">Vorname</td>
            <td th:text="${participant.lastName}">Name</td>
            <td><code th:text="${participant.code}">CODE</code></td>
            <td th:text="${participant.hunt.name}">Jagd</td>
            <td th:text="${#temporals.format(participant.start, 'dd.MM.yyyy HH:mm')}">Start</td>
            <td th:text="${participant.solved} + ' / ' + ${participant.total}">0 / 10</td>
            <td th:text="${participant.hintCount} + ' (+' + ${participant.hintCount} + ' Min.)'">0</td>
            <td th:text="${participant.durationAsFormattedString}"></td>
            <td>
                <form th:action="@{/admin/participants/delete}" method="post" class="inline">
                    <input type="hidden" name="code" th:value="${participant.code}">
                    <button type="submit" class="danger">Löschen</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(participants)}">
            <td colspan="9">Noch niemand angemeldet.</td>
        </tr>
        </tbody>
    </table>

    <h2>Aufräumen</h2>
    <div class="card">
        <p class="hint">Vor einem neuen Durchgang: alle Teilnehmenden samt Zeiten entfernen.</p>
        <form th:action="@{/admin/participants/delete-all}" method="post"
              onsubmit="return confirm('Wirklich ALLE Teilnehmenden und Zeiten löschen?');">
            <button type="submit" class="danger">Alle Teilnehmenden löschen</button>
        </form>
    </div>
</div>
</body>
</html>
