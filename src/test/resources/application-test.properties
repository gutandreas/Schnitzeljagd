# Tests laufen gegen eine H2-Datenbank im Arbeitsspeicher — sie sollen keine
# Dateien im Projektordner hinterlassen und immer bei null anfangen.
spring.datasource.url=jdbc:h2:mem:schnitzeljagd-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
schnitzeljagd.base-url=http://localhost
schnitzeljagd.admin-password=test-passwort
